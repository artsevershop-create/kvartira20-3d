<!doctype html>
<html lang="ru">

<style>

}

</head>

</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  /* ---------- apartment geometry, metres; origin at the inner corner by the entrance wall (plan: top-left), x along the entrance wall, z into the flat ---------- */
  const W = 12.86, D = 5.96, H = 2.75, CUT = 1.2, OUT = 0.5;   // inner size, ceiling, cut height, outer wall thickness
  const ROOMS = [
    { id: 'living', n: 'Кухня-гостиная', x: 0, z: 0, w: 5.18, d: 5.96, fl: 'oak', lab: [2.6, 2.3] },

    { id: 'wc', n: 'Санузел', x: 6.32, z: 0, w: 0.71, d: 1.93, fl: 'tile', short: 'С/у' },
    { id: 'bath', n: 'Ванная', x: 7.13, z: 0, w: 1.72, d: 1.93, fl: 'tile' },
    { id: 'kids', n: 'Детская', x: 8.95, z: 0, w: 3.91, d: 2.97, fl: 'oak' },
    { id: 'office', n: 'Кабинет', x: 5.27, z: 3.1, w: 2.38, d: 2.86, fl: 'oak' },
    { id: 'vest', n: 'Спальня · вход', x: 7.76, z: 3.1, w: 1.79, d: 0.84, fl: 'oak', nolab: true },
    { id: 'ward', n: 'Гардеробная', x: 7.76, z: 3.98, w: 1.79, d: 1.98, fl: 'oak' },

  ];

  // walls by centreline: [x1, z1, x2, z2, thickness, openings{a,b from the start, y0,y1}]
  const WALLS = [
    [-OUT / 2, -OUT / 2, W + OUT / 2, -OUT / 2, OUT, [{ a: 5.21 + OUT / 2, b: 6.11 + OUT / 2, y0: 0, y1: 2.1, door: 1 }]],               // entrance wall

    [-OUT / 2, 0, -OUT / 2, D, OUT, [{ a: 0.47, b: 2.22, y0: 0.8, y1: 2.25, win: 1 }, { a: 3.48, b: 5.36, y0: 0.8, y1: 2.25, win: 1 }]],   // left outer wall, two windows

    [4.56, 0, 4.56, 2.07, 0.1, []],                                                                   // kitchen | entrance hall
    [6.27, 0, 6.27, 2.0, 0.1, [{ a: 1.28, b: 1.93, y0: 0, y1: 2.1, door: 1 }]],                       // WC: door to the hall
    [7.08, 0, 7.08, 2.0, 0.1, []],                                                                    // WC | bathroom
    [8.9, 0, 8.9, 3.03, 0.12, [{ a: 2.12, b: 2.92, y0: 0, y1: 2.1, door: 1 }]],                       // bathroom + corridor | kids' room, door from the corridor
    [6.22, 2.0, 8.9, 2.0, 0.12, [{ a: 1.24, b: 1.82, y0: 0, y1: 2.1, door: 1 }]],                     // WC + bathroom bottom, bathroom door
    [8.9, 3.03, W, 3.03, 0.12, []],                                                                   // kids' room | master bedroom
    [5.18, 3.03, 8.9, 3.03, 0.12, [{ a: 1.13, b: 1.85, y0: 0, y1: 2.1, door: 1 }, { a: 2.75, b: 3.47, y0: 0, y1: 2.1, door: 1 }]],   // corridor | office, vestibule
    [7.7, 3.03, 7.7, D, 0.12, []],                                                                    // office | vestibule + wardrobe
    [5.22, 3.03, 5.22, D, 0.1, []],                                                                   // living | office: a solid wall (the office door is from the corridor)
    [9.6, 3.94, 9.6, D, 0.1, []],                                                                     // wardrobe | master bedroom
    [0, 3.06, 1.22, 3.06, 0.25, []]                                                                   // pier by the left windows
  ];

  const DOORS = [
    { x: 5.21, z: 0, w: 0.9, ax: true, ang: 0.5, flip: false, entry: true },
    { x: 6.27, z: 1.28, w: 0.65, ax: false, ang: -0.6, flip: true },
    { x: 7.46, z: 2.0, w: 0.58, ax: true, ang: 0.55, flip: true },
    { x: 8.9, z: 2.12, w: 0.8, ax: false, ang: 0.6, flip: false },
    { x: 6.31, z: 3.03, w: 0.72, ax: true, ang: -0.55, flip: false },
    { x: 7.93, z: 3.03, w: 0.72, ax: true, ang: -0.55, flip: true }
  ];
  const WIN = WALLS[2][5].map((o) => ({ side: 'w', a: o.a, b: o.b })).concat(WALLS[3][5].map((o) => ({ side: 'e', a: o.a, b: o.b })));

  /* ---------- renderer ---------- */
  const cv = $('cv');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;

  let dirty = 2; const wake = () => { dirty = Math.max(dirty, 2); };
  controls.addEventListener('change', wake);
  ['pointerdown', 'pointermove', 'pointerup', 'wheel'].forEach((e) => cv.addEventListener(e, wake, { passive: true }));

  /* ---------- textures & materials (Scandinavian modern: warm greige walls, light oak, light stone, matte graphite) ---------- */
  function rng(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function tex(draw, size) { const c = document.createElement('canvas'); c.width = c.height = size || 256; draw(c.getContext('2d'), c.width); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t; }
  const oakTex = tex((g, n) => { const r = rng(5); g.fillStyle = '#d9b98f'; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(120,80,40,' + (0.04 + r() * 0.1).toFixed(2) + ')'; g.fillRect(i * 64, 0, 64, n); g.fillStyle = 'rgba(90,60,30,.35)'; g.fillRect(i * 64, 0, 2, n); g.fillRect(i * 64, Math.floor(r() * n), 64, 2);
      for (let k = 0; k < 14; k++) { g.fillStyle = 'rgba(110,70,35,' + (0.05 + r() * 0.07).toFixed(2) + ')'; g.fillRect(i * 64 + 4 + r() * 50, r() * n, 2 + r() * 6, 20 + r() * 80); } } });
  const stoneTex = tex((g, n) => { const r = rng(9); g.fillStyle = '#e4e1da'; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 1200; i++) { g.fillStyle = 'rgba(90,85,75,' + (r() * 0.05).toFixed(3) + ')'; g.fillRect(r() * n, r() * n, 2 + r() * 10, 2 + r() * 8); }
    g.fillStyle = 'rgba(80,80,80,.22)'; g.fillRect(0, 0, n, 2); g.fillRect(0, 0, 2, n); g.fillRect(0, 126, n, 2); g.fillRect(126, 0, 2, n); });
  const tileTex = tex((g, n) => { g.fillStyle = '#dcd8d0'; g.fillRect(0, 0, n, n); g.fillStyle = 'rgba(70,70,70,.25)'; for (let i = 0; i < n; i += 64) { g.fillRect(0, i, n, 2); g.fillRect(i, 0, 2, n); } });
  const std = (c, rough, metal) => new THREE.MeshStandardMaterial({ color: c, roughness: rough == null ? 0.85 : rough, metalness: metal || 0 });
  const M = {
    wall: std('#ebe6df', 0.9), wallBath: std('#d8d2c8', 0.6), ceil: std('#f6f5f2', 0.95), wallOut: std('#d9d6cf', 0.9),
    oak: std('#ffffff', 0.7), stone: std('#ffffff', 0.5), tile: std('#ffffff', 0.45),
    oakWood: std('#c69a67', 0.65), oakLight: std('#dcc29b', 0.65), greige: std('#cfc7bb', 0.6), white: std('#f3f2ee', 0.5), graphite: std('#3a3d41', 0.5, 0.1),
    linen: std('#e8e3da', 0.95), textile: std('#8e9aa3', 0.95), accent: std('#5f7c75', 0.9), rug: std('#d6cfc2', 1), plant: std('#4f7a4a', 0.9), pot: std('#55595c', 0.7),
    metal: std('#b9bec2', 0.3, 0.7), black: std('#1f2224', 0.4), mirror: std('#e6eef2', 0.12, 0.05), screen: std('#141618', 0.35, 0.2),
    glass: new THREE.MeshPhysicalMaterial({ color: '#cfe3ec', transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0, depthWrite: false }),
    glow: new THREE.MeshBasicMaterial({ color: '#fff3dc' }), sky: new THREE.MeshBasicMaterial({ color: '#dfe9f0' }), frame: std('#f4f4f2', 0.5),
    nb: new THREE.MeshStandardMaterial({ color: '#dfe5e8', roughness: 0.95, transparent: true, opacity: 0.55 }), nbWall: std('#c5ccd1', 0.9), slab: std('#cfd4d6', 0.95), core: std('#b9c2c8', 0.9)
  };
  M.oak.map = oakTex; M.stone.map = stoneTex; M.tile.map = tileTex;

  /* ---------- groups ---------- */
  const root = new THREE.Group(); scene.add(root);
  const floors = new THREE.Group(), wallsFull = new THREE.Group(), wallsCut = new THREE.Group(), ceilings = new THREE.Group(), furn = new THREE.Group(), hi = new THREE.Group(), lo = new THREE.Group(), floorCtx = new THREE.Group();
  root.add(floors, wallsFull, wallsCut, ceilings, furn, hi, lo, floorCtx);
  function shade(m, cast) { m.castShadow = cast !== false; m.receiveShadow = true; return m; }
  function B(mat, x, z, w, d, h, y0, grp) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x + w / 2, (y0 || 0) + h / 2, z + d / 2); shade(m); (grp || furn).add(m); return m; }
  function C(mat, x, y, z, r, h, grp, seg) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 20), mat); m.position.set(x, y + h / 2, z); shade(m); (grp || furn).add(m); return m; }

  // floors and ceilings per room (the kitchen work strip is stone)
  const floorMeshes = [];
  function floorPlane(mat, x, z, w, d, rep, y) {
    const g = new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / rep, uv.getY(i) * d / rep);
    const m = new THREE.Mesh(g, mat); m.position.set(x + w / 2, y || 0.002, z + d / 2); m.receiveShadow = true; floors.add(m); floorMeshes.push(m); return m;
  }
  ROOMS.forEach((r) => {
    floorPlane(r.fl === 'oak' ? M.oak : r.fl === 'stone' ? M.stone : M.tile, r.x, r.z, r.w, r.d, r.fl === 'oak' ? 1.0 : 1.2);
    const c = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.d).rotateX(Math.PI / 2), M.ceil); c.position.set(r.x + r.w / 2, H, r.z + r.d / 2); ceilings.add(c);
  });
  floorPlane(M.stone, 0, 0, 4.56, 1.25, 1.2, 0.004);   // kitchen work zone
  { const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * OUT, 0.3, D + 2 * OUT), M.slab); slab.position.set(W / 2, -0.15, D / 2); slab.receiveShadow = true; root.add(slab); }

  /* ---------- walls with openings ---------- */
  function wall(grp, x1, z1, x2, z2, t, ops, hMax, mat) {
    const alongX = z1 === z2, L = alongX ? Math.abs(x2 - x1) : Math.abs(z2 - z1), x0 = Math.min(x1, x2), zz0 = Math.min(z1, z2);
    const seg = (a, b, y0, y1) => {
      const yy = Math.min(y1, hMax); if (b - a < 1e-3 || yy - y0 < 1e-3) return;
      const len = b - a, h = yy - y0, m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? len : t, h, alongX ? t : len), mat || M.wall);
      if (alongX) m.position.set(x0 + (a + b) / 2, y0 + h / 2, z1); else m.position.set(x1, y0 + h / 2, zz0 + (a + b) / 2);
      shade(m); grp.add(m);
    };
    let cur = 0;
    ops.slice().sort((p, q) => p.a - q.a).forEach((o) => { seg(cur, o.a, 0, hMax); if (o.y0 > 0) seg(o.a, o.b, 0, o.y0); seg(o.a, o.b, o.y1, hMax); cur = o.b; });
    seg(cur, L, 0, hMax);
  }
  WALLS.forEach((w, i) => { const outer = i < 4; wall(wallsFull, w[0], w[1], w[2], w[3], w[4], w[5], H, outer ? M.wallOut : M.wall); wall(wallsCut, w[0], w[1], w[2], w[3], w[4], w[5], CUT, outer ? M.wallOut : M.wall); });
  // wall caps on the cut walls (a light top so the plan reads as a drawing)
  // bathroom and WC: tiled walls inside (thin skins)
  [[6.32, 0, 0.71, 1.93], [7.13, 0, 1.72, 1.93]].forEach((r) => {
    const skin = (x, z, w, d) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, H - 0.02, d), M.wallBath); m.position.set(x + w / 2, H / 2, z + d / 2); hi.add(m); };
    skin(r[0], r[1], r[2], 0.012); skin(r[0], r[1] + r[3] - 0.012, r[2], 0.012); skin(r[0], r[1], 0.012, r[3]); skin(r[0] + r[2] - 0.012, r[1], 0.012, r[3]);
  });
  // the pier column by the far windows and the storage niche wall
  B(M.wall, 0.97, 4.64, 0.22, 1.32, H, 0, wallsFull); B(M.wall, 0.97, 4.64, 0.22, 1.32, CUT, 0, wallsCut);
  // wardrobe sliding front: two oak panels, one slid open
  B(M.oakLight, 7.76, 3.92, 0.9, 0.04, H - 0.05, 0, hi); B(M.oakLight, 8.62, 3.96, 0.9, 0.04, H - 0.05, 0, hi);
  B(M.oakLight, 7.76, 3.92, 0.9, 0.04, CUT, 0, lo); B(M.oakLight, 8.62, 3.96, 0.9, 0.04, CUT, 0, lo);

  /* ---------- doors: frame + leaf, full set with the full walls, a cut set over the plan ---------- */
  DOORS.forEach((o) => {
    [[hi, 2.1], [lo, CUT - 0.02]].forEach((pair) => {
      const grp = pair[0], hh = pair[1], t = 0.12, fm = M.frame;
      if (o.ax) { B(fm, o.x - 0.05, o.z - t / 2, 0.05, t, hh, 0, grp); B(fm, o.x + o.w, o.z - t / 2, 0.05, t, hh, 0, grp); if (hh > 2) B(fm, o.x - 0.05, o.z - t / 2, o.w + 0.1, t, 0.06, 2.1, grp); }
      else { B(fm, o.x - t / 2, o.z - 0.05, t, 0.05, hh, 0, grp); B(fm, o.x - t / 2, o.z + o.w, t, 0.05, hh, 0, grp); if (hh > 2) B(fm, o.x - t / 2, o.z - 0.05, t, o.w + 0.1, 0.06, 2.1, grp); }
      const g = new THREE.Group(); grp.add(g);
      const hx = o.ax ? (o.flip ? o.x + o.w : o.x) : o.x, hz = o.ax ? o.z : (o.flip ? o.z + o.w : o.z);
      g.position.set(hx, 0, hz); g.rotation.y = (o.ax ? 0 : Math.PI / 2) + o.ang * (o.flip ? -1 : 1);

    kids: [[9.15, 1.55, 2.75], [11.6, 1.0, 0.5]], office: [[6.6, 1.55, 3.3], [6.2, 1.0, 5.6]], ward: [[8.65, 1.5, 3.5], [8.65, 1.1, 5.8]], master: [[9.85, 1.55, 3.25], [11.9, 0.9, 5.4]] };
  let anim = null;
  function flyTo(pos, tgt, instant) {
    const to = { p: new THREE.Vector3().fromArray(pos), t: new THREE.Vector3().fromArray(tgt) };
    if (instant) { camera.position.copy(to.p); controls.target.copy(to.t); anim = null; controls.update(); wake(); return; }
    anim = { t0: performance.now(), dur: 1100, p0: camera.position.clone(), g0: controls.target.clone(), to: to }; wake();
  }
  function applyView(instant) {
    const walk = S.cam === 'walk';
    controls.minDistance = walk ? 0.3 : 2; controls.maxDistance = walk ? 4 : 60; controls.enablePan = !walk; controls.maxPolarAngle = walk ? Math.PI / 2 + 0.25 : Math.PI / 2 - 0.02;
    if (walk) { const e = EYE[S.room] || EYE.all; flyTo(e[0], e[1], instant); }
    else { const v = VIEWS[S.room] || VIEWS.all, f = camera.aspect < 1 ? Math.max(1, 0.95 / camera.aspect) : 1;   // a portrait phone: further back, so the whole plan fits
      flyTo(v.tgt.map((t, i) => t + (v.pos[i] - t) * f), v.tgt, instant); }
    refresh();
  }
  function refresh() {
    const walk = S.cam === 'walk', full = walk || S.walls === 'full';
    wallsFull.visible = full; hi.visible = full; wallsCut.visible = lo.visible = !full; ceilings.visible = walk; floorCtx.visible = S.ctx && !walk;
    $('note').textContent = walk ? 'Прогулка: нажмите на пол, чтобы перейти · потяните, чтобы осмотреться' : full ? 'Стены полной высоты · вид сверху' : 'Стены срезаны на 1,2 м, чтобы видеть планировку';
    $('hint').textContent = walk ? 'Нажмите на пол, чтобы перейти' : 'Вращайте мышью или пальцем · колесо / щипок — ближе';
    sync.forEach((f) => f()); renderer.shadowMap.needsUpdate = true; wake();
  }
  // walk: a tap on the floor moves the eye there, keeping the direction of view
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
  cv.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY, performance.now()]; });
  cv.addEventListener('pointerup', (e) => {
    if (!downAt || S.cam !== 'walk') return; const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); if (moved > 8 || performance.now() - downAt[2] > 600) return;
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(floorMeshes, false)[0]; if (!hit) return;
    const dir = new THREE.Vector3().subVectors(controls.target, camera.position); dir.y = 0; dir.normalize();
    const p = hit.point.clone(); p.y = 1.55; const t = p.clone().add(dir.multiplyScalar(2.5)); t.y = 1.15;
    flyTo(p.toArray(), t.toArray(), false);
  });

  /* ---------- UI ---------- */
  const sync = [];
  function chip(parent, text, test, fn, small) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (small ? ' sm' : ''); b.textContent = text; b.addEventListener('click', fn); parent.appendChild(b); sync.push(() => b.setAttribute('aria-pressed', test() ? 'true' : 'false')); return b; }
  chip($('rRoom'), 'Вся квартира', () => S.room === 'all', () => { S.room = 'all'; applyView(false); });
  ROOMS.forEach((r) => { if (r.id === 'vest') return; chip($('rRoom'), r.n, () => S.room === r.id, () => { S.room = r.id; applyView(false); }); });
  chip($('rCam'), 'Сверху', () => S.cam === 'top', () => { S.cam = 'top'; applyView(false); }, true);
  chip($('rCam'), '3D прогулка', () => S.cam === 'walk', () => { S.cam = 'walk'; applyView(false); }, true);
  chip($('rWalls'), 'Срезаны', () => S.walls === 'cut', () => { S.walls = 'cut'; refresh(); }, true);
  chip($('rWalls'), 'Полные', () => S.walls === 'full', () => { S.walls = 'full'; refresh(); }, true);
  chip($('rMore'), 'План этажа', () => S.ctx, () => { S.ctx = !S.ctx; if (S.ctx) { S.cam = 'top'; S.room = 'all'; flyTo([W / 2 + 2, 24, D + 12], [W / 2, 0, D / 2 - 2.5], false); controls.maxDistance = 60; } refresh(); }, true);
  chip($('rMore'), 'Вечер', () => S.evening, () => { S.evening = !S.evening; setTime(S.evening); refresh(); }, true);

  /* ---------- room labels (HTML over the 3D) ---------- */
  const labEl = $('labels'), labDom = [], v3 = new THREE.Vector3();
  const LAB = ROOMS.filter((r) => !r.nolab).map((r) => ({ x: r.lab ? r.lab[0] : r.x + r.w / 2, z: r.lab ? r.lab[1] : r.z + r.d / 2, t: r.short || r.n, a: r.a, y: CUT + 0.3 }));
  function updateLabels() {
    const walk = S.cam === 'walk', items = walk ? [] : LAB.filter((l) => innerWidth > 640 || l.a >= 4).map((l) => ({ x: l.x, y: S.walls === 'full' ? H + 0.2 : l.y, z: l.z, html: l.t + '<small>' + String(l.a).replace('.', ',') + ' м²</small>', cls: 'gl' }));
    if (S.ctx && !walk) nbList.forEach((n) => items.push({ x: n.m.position.x, y: 1.1, z: n.m.position.z, html: n.t, cls: 'gl nb' }));
    while (labDom.length < items.length) { const d = document.createElement('div'); labEl.appendChild(d); labDom.push(d); }
    labDom.forEach((d, i) => { const it = items[i]; if (!it) { d.style.display = 'none'; return; }
      v3.set(it.x, it.y, it.z).project(camera); if (v3.z > 1) { d.style.display = 'none'; return; }
      d.style.display = ''; if (d._h !== it.html) { d.innerHTML = it.html; d._h = it.html; } d.className = it.cls;
      d.style.transform = 'translate(' + ((v3.x * 0.5 + 0.5) * innerWidth).toFixed(0) + 'px,' + ((-v3.y * 0.5 + 0.5) * innerHeight).toFixed(0) + 'px) translate(-50%,-50%)'; });
  }

  /* ---------- loop ---------- */
  function resize() { const w = innerWidth, h = innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 56 : 42; camera.updateProjectionMatrix(); wake(); }
  addEventListener('resize', resize); resize();
  function frame() {
    requestAnimationFrame(frame);
    if (anim) { const k = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; camera.position.lerpVectors(anim.p0, anim.to.p, e); controls.target.lerpVectors(anim.g0, anim.to.t, e); if (k >= 1) anim = null; wake(); }
    controls.update();
    if (dirty > 0) { dirty--; renderer.render(scene, camera); updateLabels(); }
  }
  setTime(false); applyView(true); renderer.shadowMap.needsUpdate = true; frame();
  window.__kv = { S: S, camera: camera, controls: controls, renderer: renderer, scene: scene, fly: flyTo, refresh: refresh };
})();
</script>
</body>
