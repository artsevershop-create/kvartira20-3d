<title>Квартира 20 · 6 этаж · 3D</title>

<style>
:root{--bg:#eef0f0;--surf:#fff;--ink:#1d2427;--mut:#5b6670;--acc:#2a6f8f;--accfg:#fff;--chip:#e7ecee;--line:#d5dbde;--f:"Noto Sans","Segoe UI",system-ui,sans-serif}

.chip{flex:none;border:1px solid var(--line);background:color-mix(in srgb,var(--surf) 92%,transparent);color:var(--ink);font:500 13px var(--f);padding:8px 13px;border-radius:999px;cursor:pointer;min-height:38px;white-space:nowrap;touch-action:manipulation;box-shadow:0 1px 3px rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:6px}

  .hint{display:none}

  /* ---------- loop ---------- */
  function resize() { const w = innerWidth, h = innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 56 : 42; camera.updateProjectionMatrix(); wake(); }
  addEventListener('resize', resize); resize();

  function frame() {

    if (anim) { const k = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; camera.position.lerpVectors(anim.p0, anim.to.p, e); controls.target.lerpVectors(anim.g0, anim.to.t, e); if (k >= 1) anim = null; wake(); }

  }
  applyStyle('light'); setTime(false); applyView(true); renderer.shadowMap.needsUpdate = true; frame();
  window.__kv = { S: S, camera: camera, controls: controls, renderer: renderer, scene: scene, fly: flyTo, refresh: refresh, findPath: findPath, applyView: applyView };
})();
